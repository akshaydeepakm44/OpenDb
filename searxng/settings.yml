# OpenDB SearXNG Settings — Hardened multi-engine for B2B lead enrichment & LinkedIn verification
# https://docs.searxng.org/admin/settings/

use_default_settings: true

server:
  secret_key: "46i4zmw5RXBftHrqsw4Y8OqmYDiHK104"
  image_proxy: false
  limiter: false
  public_instance: false

outgoing:
  request_timeout: 4.0
  max_request_timeout: 6.0
  pool_connections: 100
  pool_maxsize: 100
  enable_http2: true

search:
  formats:
    - html
    - json
  default_lang: "en"
  safe_search: 0
  autocomplete: ""
  ban_time_on_fail: 5
  max_ban_time_on_fail: 30
  suspended_times:
    SearxEngineCaptchaException: 0
    SearxEngineAccessDeniedException: 0
    cf_SearxEngineCaptchaException: 0
    SearxEngineAPIException: 0

# Multi-engine configuration:
engines:
  - name: bing
    engine: bing
    categories: [general, it, business]
    shortcut: b
    weight: 3
    enabled: true

  - name: duckduckgo
    engine: duckduckgo
    categories: [general, it, business]
    shortcut: ddg
    weight: 3
    enabled: true

  - name: google
    engine: google
    categories: [general, it, business]
    shortcut: g
    weight: 3
    enabled: true

  - name: yahoo
    engine: yahoo
    categories: [general, it, business]
    shortcut: yh
    weight: 2
    enabled: true

  - name: qwant
    engine: qwant
    categories: [general, it, business]
    shortcut: qw
    weight: 2
    enabled: true

  - name: brave
    engine: brave
    categories: [general, it, business]
    shortcut: br
    weight: 2
    enabled: true

  # Wikipedia and Wikidata are intentionally excluded from all categories.
  # They return encyclopedic pages, never company homepages or B2B leads,
  # and add 4-6s response latency to every search cycle.
  # If needed for research queries, re-enable in a separate 'research' category only.

  - name: mojeek
    engine: mojeek
    categories: [general, it, business]
    shortcut: mj
    weight: 1
    enabled: true
