services:
  postgres:
    image: postgres:15-alpine
    container_name: opendb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: opendb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opendb_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:password123@postgres:5432/opendb
      - RAW_STORAGE_DIR=/app/data
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opendb_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
