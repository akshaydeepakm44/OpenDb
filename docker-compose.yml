services:
  # ─── PostgreSQL + pgvector ────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: opendb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-opendb}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-opendb}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── Redis (internal only, password-protected) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: opendb_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-opendb_redis_secret}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-opendb_redis_secret}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── MinIO (S3-compatible object storage) ─────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: opendb_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9002:9000" # S3 API — localhost only
      - "9001:9001" # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── MinIO bucket initializer (runs once) ─────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: opendb_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " mc alias set opendb http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123}; mc mb opendb/opendb --ignore-existing; echo 'MinIO buckets initialized.'; exit 0; "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}

  # ─── SearXNG (self-hosted meta-search) ───────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: opendb_searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:8080" # internal only
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/

  # ─── pgAdmin 4 (PostgreSQL Web UI) ────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: opendb_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@opendb.internal}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ─── Redis Commander (Redis Web UI) ───────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: opendb_redis_commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=opendb:redis:6379:0:${REDIS_PASSWORD:-opendb_redis_secret}
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy

  # ─── Backend API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opendb_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-opendb}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-opendb_redis_secret}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-opendb_redis_secret}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-opendb_redis_secret}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_SECURE=false
      - STORAGE_BACKEND=minio
      - SEARXNG_URL=http://searxng:8080
      - SCHEMAS_DIR=/app/schemas
    volumes:
      - ./backend/app:/app/app
      - ./schemas:/app/schemas:ro
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # ─── Celery Workers (Dedicated Queues) ─────────────────────────────────
  celery_discovery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opendb_celery_discovery
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=50 -Q discovery,celery
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-opendb}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-opendb_redis_secret}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-opendb_redis_secret}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-opendb_redis_secret}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_SECURE=false
      - STORAGE_BACKEND=minio
      - SEARXNG_URL=http://searxng:8080
      - SCHEMAS_DIR=/app/schemas
    volumes:
      - ./backend/app:/app/app
      - ./schemas:/app/schemas:ro
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  celery_crawler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opendb_celery_crawler
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=50 -Q crawl,celery
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-opendb}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-opendb_redis_secret}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-opendb_redis_secret}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-opendb_redis_secret}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_SECURE=false
      - STORAGE_BACKEND=minio
      - SEARXNG_URL=http://searxng:8080
      - SCHEMAS_DIR=/app/schemas
    volumes:
      - ./backend/app:/app/app
      - ./schemas:/app/schemas:ro
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  celery_verification:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opendb_celery_verification
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=50 -Q verification,celery
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-opendb}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-opendb_redis_secret}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-opendb_redis_secret}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-opendb_redis_secret}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_SECURE=false
      - STORAGE_BACKEND=minio
      - SEARXNG_URL=http://searxng:8080
      - SCHEMAS_DIR=/app/schemas
    volumes:
      - ./backend/app:/app/app
      - ./schemas:/app/schemas:ro
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # ─── Frontend UI ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opendb_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  pgadmin_data:
